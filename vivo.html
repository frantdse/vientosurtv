<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emisión en Vivo | Canal 9 Ushuaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #ffffff;
            --text-main: #111827;
            --text-muted: #64748b;
            --cherry-deep: #e83e63;
            --border-light: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }

        .cherry-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .cherry-blossom {
            position: absolute;
            top: -15%;
            background: radial-gradient(circle, #ff8fa3 0%, var(--cherry-deep) 100%);
            border-radius: 160% 20% 160% 20%;
            animation: fallAndSway linear infinite;
            opacity: 0.8;
            box-shadow: 0 0 15px rgba(232, 62, 99, 0.3);
        }

        @keyframes fallAndSway {
            0% { transform: translateY(-10vh) translateX(0px) rotate(0deg); opacity: 0; }
            15% { opacity: 0.85; }
            50% { transform: translateY(50vh) translateX(90px) rotate(180deg); }
            85% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(-60px) rotate(360deg); opacity: 0; }
        }

        .cherry-blossom:nth-child(1) { left: 3%; width: 34px; height: 23px; animation-duration: 9s; animation-delay: 0s; }
        .cherry-blossom:nth-child(2) { left: 15%; width: 28px; height: 19px; animation-duration: 12s; animation-delay: 2s; }
        .cherry-blossom:nth-child(3) { left: 27%; width: 38px; height: 26px; animation-duration: 7s; animation-delay: 1s; }
        .cherry-blossom:nth-child(4) { left: 40%; width: 30px; height: 20px; animation-duration: 14s; animation-delay: 3s; }
        .cherry-blossom:nth-child(5) { left: 53%; width: 35px; height: 24px; animation-duration: 10s; animation-delay: 1.5s; }
        .cherry-blossom:nth-child(6) { left: 66%; width: 25px; height: 17px; animation-duration: 13s; animation-delay: 2.5s; }
        .cherry-blossom:nth-child(7) { left: 79%; width: 32px; height: 21px; animation-duration: 8s; animation-delay: 0.5s; }
        .cherry-blossom:nth-child(8) { left: 91%; width: 40px; height: 28px; animation-duration: 11s; animation-delay: 1.8s; }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-bar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.7rem;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            background: linear-gradient(135deg, var(--cherry-deep), #ff708f);
            color: white;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .back-home-btn {
            background: transparent;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-home-btn:hover {
            background: var(--text-main);
            color: white;
        }

        .live-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        .live-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .live-title-area h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .live-badge {
            background: var(--cherry-deep);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: pulseLive 2s infinite;
        }

        @keyframes pulseLive {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.03); }
            100% { opacity: 1; transform: scale(1); }
        }

        .live-description {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 5px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--border-light);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        footer {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px 40px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="cherry-container">
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
        <div class="cherry-blossom"></div>
    </div>

    <header>
        <div class="nav-bar">
            <div class="brand-logo">
                CANAL 9 <span>USHUAIA</span>
            </div>
            <a href="index.html" class="back-home-btn">&larr; Volver al Inicio</a>
        </div>
    </header>

    <main class="live-container">
        <div class="live-header">
            <div class="live-title-area">
                <h1>Transmisión en Directo <span class="live-badge">EN VIVO HD</span></h1>
                <p class="live-description">Señal oficial abierta desde Tierra del Fuego para todo el mundo.</p>
            </div>
        </div>

        <div class="video-wrapper">
            <iframe src="https://rumble.com/embed/v7d8uva/?pub=4qidam" 
                    title="Canal 9 Ushuaia En Vivo" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>
    </main>

    <footer>
        <div><strong>Canal 9 Ushuaia</strong> &bull; La TV del Fin del Mundo</div>
        <div>Señal Oficial en Directo</div>
    </footer>

</body>
</html>
